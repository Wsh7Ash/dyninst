[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dyninst"
version = "1.0.0"
description = "Dynamic-instrumentation skills for Frida, GDB, LD_PRELOAD and eBPF, with a CLI that validates and renders them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["frida", "gdb", "ld-preload", "ebpf", "instrumentation", "bug-bounty", "skills"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dyninst = "dyninst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"